<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração: rotas entre as unidades, prédios e ferramentas de manutenção">
  <defs>
    <radialGradient id="bg" cx="88%" cy="4%" r="115%">
      <stop offset="0" stop-color="#5A1A10"/>
      <stop offset=".35" stop-color="#3A0B06"/>
      <stop offset=".7" stop-color="#220604"/>
      <stop offset="1" stop-color="#0E0605"/>
    </radialGradient>
    <radialGradient id="calm" cx="50%" cy="46%" r="32%">
      <stop offset="0" stop-color="#0E0605" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0E0605" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#C7932D" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C7932D" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C7932D" stop-opacity=".12"/>
    </linearGradient>
    <g id="pin">
      <path d="M0-30c-11 0-19 8.5-19 19 0 14 19 31 19 31s19-17 19-31c0-10.5-8-19-19-19z" fill="#250504" stroke="#C7932D" stroke-width="2.2"/>
      <circle cy="-11" r="6.5" fill="#C7932D"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- diagonais da assinatura -->
  <g stroke="#C7932D" stroke-opacity=".12" stroke-width="1.4">
    <line x1="1180" y1="0" x2="1920" y2="560"/>
    <line x1="1400" y1="0" x2="1920" y2="390"/>
    <line x1="0" y1="640" x2="520" y2="1080"/>
  </g>

  <!-- engrenagem e chave (manutenção), canto superior direito -->
  <g transform="translate(1655 235)" fill="none" stroke="#C7932D" stroke-opacity=".32" stroke-width="2.4" stroke-linejoin="round">
    <path d="M0-118l17 2 7 25 18 8 23-13 13 11 11 13-13 23 8 18 25 7 2 17-2 17-25 7-8 18 13 23-11 13-13 11-23-13-18 8-7 25-17 2-17-2-7-25-18-8-23 13-13-11-11-13 13-23-8-18-25-7-2-17 2-17 25-7 8-18-13-23 11-13 13-11 23 13 18-8 7-25z"/>
    <circle r="44"/>
    <circle r="20" stroke-opacity=".22"/>
  </g>
  <g transform="translate(1470 130) rotate(-38)" fill="none" stroke="#C7932D" stroke-opacity=".4" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-22-150c-18 8-30 26-30 47 0 18 9 34 23 43V96c0 11 9 20 20 20h18c11 0 20-9 20-20V-60c14-9 23-25 23-43 0-21-12-39-30-47v40l-22 14-22-14z"/>
    <line x1="9" y1="-30" x2="9" y2="86" stroke-opacity=".22"/>
  </g>

  <!-- trena / régua -->
  <g transform="translate(250 150) rotate(-12)" fill="none" stroke="#C7932D" stroke-opacity=".26" stroke-width="2">
    <rect x="0" y="0" width="300" height="38" rx="6"/>
    <path d="M20 0v14M40 0v9M60 0v14M80 0v9M100 0v20M120 0v9M140 0v14M160 0v9M180 0v14M200 0v20M220 0v9M240 0v14M260 0v9M280 0v14"/>
  </g>

  <!-- prancheta com checklist -->
  <g transform="translate(120 300)" fill="none" stroke="#C7932D" stroke-opacity=".28" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="12" width="150" height="196" rx="12"/>
    <rect x="45" y="0" width="60" height="26" rx="7"/>
    <path d="M24 70l10 10 18-20M68 72h58M24 118l10 10 18-20M68 120h58M24 166l10 10 18-20M68 168h44"/>
  </g>

  <!-- skyline das unidades -->
  <g fill="none" stroke="url(#fadeUp)" stroke-width="2" stroke-linejoin="round">
    <path d="M0 930H110V842h60v-46h70v134"/>
    <path d="M240 930V770h120v160"/>
    <path d="M262 800h20M300 800h20M338 800h0M262 836h20M300 836h20M262 872h20M300 872h20M338 836h0"/>
    <!-- clube (arcos) -->
    <path d="M380 930V820q0-44 70-62 70 18 70 62v110"/>
    <path d="M410 930v-60q0-22 40-30 40 8 40 30v60"/>
    <path d="M450 758v-38M436 726l14-14 14 14"/>
    <!-- prédio alto -->
    <path d="M560 930V640h130v290M560 680h130"/>
    <path d="M584 712h24M642 712h24M584 750h24M642 750h24M584 788h24M642 788h24M584 826h24M642 826h24M584 864h24M642 864h24"/>
    <path d="M625 640v-46"/>
    <!-- restaurante -->
    <path d="M720 930V832l80-50 80 50v98M752 930v-58h96v58"/>
    <!-- centro de distribuição -->
    <path d="M1180 930V830l120-56 120 56v100M1212 930v-74h176v74M1212 880h176M1212 905h176"/>
    <!-- prédio corporativo -->
    <path d="M1460 930V700h150v230M1460 740h150"/>
    <path d="M1486 772h22M1522 772h22M1558 772h22M1486 810h22M1522 810h22M1558 810h22M1486 848h22M1522 848h22M1558 848h22M1486 886h22M1522 886h22M1558 886h22"/>
    <path d="M1640 930V790h100v140M1660 820h60M1660 850h60M1660 880h60"/>
    <path d="M1760 930V860h80v-50h80"/>
  </g>
  <line x1="0" y1="930" x2="1920" y2="930" stroke="#C7932D" stroke-opacity=".5" stroke-width="2"/>
  <line x1="0" y1="944" x2="1920" y2="944" stroke="#C7932D" stroke-opacity=".14" stroke-width="1.2"/>

  <!-- rota entre as unidades -->
  <path id="rota" d="M120 760C300 640 380 560 520 600S760 720 900 640 1060 470 1240 520 1500 650 1640 560 1800 420 1860 400" fill="none" stroke="#C7932D" stroke-opacity=".75" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="17" fill="#E1D5BB" fill-opacity=".72" letter-spacing="1.5" text-anchor="middle">
    <use href="#pin" x="120" y="760"/><text x="120" y="805">CD 1</text>
    <use href="#pin" x="520" y="600"/><text x="520" y="645">M.C.</text>
    <use href="#pin" x="900" y="640"/><text x="900" y="685">DORYO</text>
    <use href="#pin" x="1240" y="520"/><text x="1240" y="565">M.G.</text>
    <use href="#pin" x="1640" y="560"/><text x="1640" y="605">CARDOSO</text>
  </g>

  <!-- van da logística -->
  <g transform="translate(905 980)" fill="none" stroke="#C7932D" stroke-opacity=".62" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0-14V-98c0-6 5-11 11-11h150l46 46c4 4 6 9 6 15v34"/>
    <path d="M161-109v46h52"/>
    <path d="M30-14H-8M108-14H62M240-14h-27"/>
    <path d="M0-14h-12v-20M213-14h28v-24"/>
    <circle cx="46" cy="-14" r="18"/><circle cx="196" cy="-14" r="18"/>
    <path d="M22-82h52M22-60h80" stroke-opacity=".35"/>
  </g>
  <g stroke="#C7932D" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
    <line x1="820" y1="940" x2="870" y2="940"/><line x1="790" y1="952" x2="860" y2="952"/>
  </g>
  <line x1="0" y1="1004" x2="1920" y2="1004" stroke="#C7932D" stroke-opacity=".18" stroke-width="1.4" stroke-dasharray="26 22"/>

  <!-- área calma para o cartão de login -->
  <rect width="1920" height="1080" fill="url(#calm)"/>
</svg>
