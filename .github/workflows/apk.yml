# Gera o APK Android do Facilities MC (app que abre o sistema da Vercel em tela cheia).
# Roda sozinho quando a pasta android muda, ou pelo botão "Run workflow" na aba Actions.
# Precisa de 2 segredos no GitHub (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  -> conteúdo do arquivo chave-base64.txt
#   ANDROID_KEYSTORE_SENHA   -> a senha da chave
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Numerar a versão do app
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle

      - name: Montar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assinar o APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_SENHA" ]; then echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_SENHA"; exit 1; fi
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/chave.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alinhado.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/chave.keystore" --ks-key-alias facilitiesmc \
            --ks-pass env:KS_SENHA --key-pass env:KS_SENHA --out facilities-mc.apk "$RUNNER_TEMP/alinhado.apk"
          "$BT/apksigner" verify --print-certs facilities-mc.apk
          rm -f "$RUNNER_TEMP/chave.keystore"

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: facilities-mc-apk
          path: facilities-mc.apk

      - name: Publicar o APK (aba Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Facilities MC Android 1.0.${{ github.run_number }}
          body: APK do Facilities MC. Baixe o arquivo facilities-mc.apk e instale no celular.
          files: facilities-mc.apk

  # Teste automático: instala o APK num celular virtual (emulador Android),
  # abre o app e guarda o registro do sistema. Se o app travar, o erro aparece aqui.
  teste:
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Baixar o APK
        uses: actions/download-artifact@v4
        with:
          name: facilities-mc-apk

      - name: Liberar o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o app no celular virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r facilities-mc.apk
            adb logcat -c
            adb shell monkey -p br.com.grupomontecarlo.facilities -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt || true
            grep -n -A40 "FATAL EXCEPTION" logcat.txt || echo "RESULTADO - o app abriu sem travar no celular virtual"
            adb shell dumpsys activity activities | grep -i "ResumedActivity" || true

      - name: Guardar o registro do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-logcat
          path: logcat.txt
          if-no-files-found: ignore
